<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>OTA</title><style>body{background:#0a0c12;color:#e8f0f8;margin:0;padding:12px;font-family:monospace}h1{color:#e74c3c;font-size:1.3em;margin:0 0 10px}.c{max-width:700px;margin:0 auto;background:#141b25;padding:20px;border:2px solid #e74c3c;border-radius:8px}input[type=file]{display:block;margin:10px 0;padding:8px;background:#0b1320;color:#e8f0f8;border:1px solid #335174;border-radius:4px;width:100%;box-sizing:border-box}.b{background:#e74c3c;color:#fff;padding:10px 15px;border:0;border-radius:4px;cursor:pointer;margin:5px 2px;font-weight:bold;font-family:monospace}.b:hover{filter:brightness(1.1)}.s{margin:10px 0;padding:10px;border-radius:4px;display:none}.ok{background:#1a4d2e;color:#2ecc71;border:1px solid #2ecc71}.err{background:#4d1a1a;color:#ff6b6b;border:1px solid #ff6b6b}</style></head><body><div class=c><h1>OTA UPDATE</h1><input type=file id=f accept=.py><div id=fi style="color:#9fb4cb;font-size:0.9em">Datei waehlen...</div><div id=s class=s></div><button class=b onclick=u()>Upload</button><button class=b onclick="location.href='/'" style="background:#2980b9">Home</button><button class=b onclick="location.href='/admin-profiles'" style="background:#27ae60">Profile</button><button class=b onclick=r() style="background:#c00">Restart</button><div style="margin-top:20px;padding-top:15px;border-top:1px solid #333"><h2 style="color:#3498db;font-size:1em;margin:0 0 10px">Trick-Simulation (Test ohne Drohne)</h2><div id=simst style="color:#9fb4cb;font-size:.85em;margin-bottom:8px">Bereit...</div><button class=b onclick="sim('roll')" style="background:#2980b9">Roll</button><button class=b onclick="sim('flip')" style="background:#8e44ad">Flip</button><button class=b onclick="sim('spin')" style="background:#16a085">Spin</button></div></div><script>document.getElementById('f').addEventListener('change',function(e){const f=e.target.files[0];document.getElementById('fi').innerText=f?'Datei: '+f.name+' ('+(f.size/1024).toFixed(1)+' KB)':'Datei waehlen...'});function u(){const f=document.getElementById('f').files[0],s=document.getElementById('s');if(!f){s.className='s err';s.innerText='Keine Datei!';s.style.display='block';return;}const rd=new FileReader();rd.onload=function(e){try{const ct=e.target.result,enc=new TextEncoder(),b=enc.encode(ct);let bn='';for(let i=0;i<b.length;i+=10240){const ch=b.slice(i,i+10240);for(let j=0;j<ch.length;j++)bn+=String.fromCharCode(ch[j]);}const b64=btoa(bn),tc=Math.ceil(b64.length/1024);let idx=0;s.innerText='Chunk 1/'+tc;s.className='s';s.style.display='block';function nc(){if(idx>=tc){fetch('/finalize-upload',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.ok){s.className='s ok';s.innerText='Fertig: '+d.message}else{s.className='s err';s.innerText='Fehler: '+d.error;}}).catch(er=>{s.className='s err';s.innerText='Fehler: '+er;});return;}const st=idx*1024,ed=Math.min(st+1024,b64.length),cd=b64.substring(st,ed);fetch('/upload-chunk',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'index='+idx+'&total='+tc+'&data='+encodeURIComponent(cd),cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.ok){idx++;s.innerText='Chunk '+(idx+1)+'/'+tc;nc();}else{s.className='s err';s.innerText='Fehler: '+d.error;}}).catch(er=>{s.className='s err';s.innerText='Fehler: '+er;});}nc();}catch(er){s.className='s err';s.innerText='Fehler: '+er;s.style.display='block';}};rd.readAsText(f);}function r(){if(confirm('Restart Pico?')){fetch('/restart-pico',{cache:'no-store'}).catch(()=>{});setTimeout(()=>location.href='/',2000);}}function sim(t){const s=document.getElementById('simst');s.innerText='Simuliere '+t+'...';fetch('/simulate-trick?type='+t,{cache:'no-store'}).then(r=>r.json()).then(d=>{s.innerText=d.ok?(d.trick?('OK: '+d.trick+' (+'+d.points+' Pkt)'):'Kein Trick erkannt (Schwellenwerte pruefen)'):'Fehler: '+d.error;}).catch(er=>{s.innerText='Fehler: '+er;});}</script></body></html>
