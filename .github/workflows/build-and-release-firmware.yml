name: Firmware bauen & releasen

# Baut firmware.nbo mit build_firmware.py (Kommandozeilen-Modus, kein GUI
# noetig) und den Windows Installer (windows/build_exe.py) und
# veroeffentlicht beide Ergebnisse in EINER gemeinsamen GitHub Release als:
#   1. Download-Artefakt des Workflow-Laufs (Actions-Tab, ~90 Tage gueltig)
#   2. Anhang derselben GitHub Release mit automatisch generierter
#      Versionsnummer (Datum + Lauf-Nummer)
on:
  push:
    branches:
      - main
    paths:
      - "source/**"
      - "tools/build_firmware.py"
      - "windows/**"
  workflow_dispatch: {}
    # Manuelles Ausloesen ueber den "Run workflow"-Button im Actions-Tab.

permissions:
  contents: write
    # Noetig, damit der Workflow eine GitHub Release erstellen darf.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python-Abhaengigkeiten installieren
        # mpy-cross wird seit der mpy-Kompilierung in build_bundle() (siehe
        # tools/build_firmware.py) fuer JEDEN Bundle-Build gebraucht, nicht
        # nur fuer den lizenzierten Seriell-Build.
        run: pip install -r requirements/requirements.txt

      - name: Firmware-Bundles bauen (alle Modi ausser light)
        run: |
          python tools/build_firmware.py build/firmware.nbo --mode normal
          python tools/build_firmware.py build/firmware-recovery.nbo --mode recovery --no-version-bump
          python tools/build_firmware.py build/emergency.nbo --mode bootmain --no-version-bump
        # Erhoeht dabei automatisch die Firmware-Versionsnummer (version.json /
        # firmware_version.txt, Format X.Y.Z -> X.Y.Z+1, siehe build_firmware.py) -
        # nur beim ersten Aufruf (--mode normal), alle weiteren Modi nutzen
        # bewusst --no-version-bump und teilen sich denselben Versionsstand/
        # dasselbe Release. main_gatehill.py/role_setup.py/index_gatehill.html
        # sind bereits Teil des normalen Bundles (APP_FILES_TO_BUNDLE), ein
        # separates gatehill.nbo ist daher nicht mehr noetig.
        #
        # WICHTIG: --mode light (firmware-light.nbo) wird hier bewusst NICHT
        # mehr gebaut/veroeffentlicht - dieser Modus wird nicht mehr per
        # Workflow bereitgestellt.
        #
        # WICHTIG: --mode complete (firmware-complete.nbo) wird hier bewusst
        # NICHT gebaut/veroeffentlicht - dieser Modus bindet public_key.pem
        # mit ein (siehe build_firmware.py's Kommentar bei
        # PUBLIC_KEY_BUNDLE_FILENAME) und ist AUSSCHLIESSLICH fuer den
        # seriellen Lizenz-Flash-Weg gedacht (build_and_flash_with_license()),
        # nicht fuer einen oeffentlichen Download. Ein automatisierter,
        # oeffentlicher Release wuerde den Public Key sonst fuer jeden
        # extrahierbar machen, der die .nbo-Datei herunterlaedt.

      - name: Versionsnummer bestimmen
        id: version
        run: |
          FW_VERSION=$(python -c "import json; print(json.load(open('source/version.json'))['version'])")
          echo "tag=v${FW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Neue Versionsnummer ins Repo zurueckschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/version.json source/firmware_version.txt
          if ! git diff --cached --quiet; then
            git commit -m "Firmware-Version auf ${{ steps.version.outputs.tag }} erhoeht [skip ci]"
            git push
          fi

      - name: Firmware-Bundles als Download-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bundles
          path: |
            build/firmware.nbo
            build/firmware-recovery.nbo
            build/emergency.nbo
          retention-days: 90

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Firmware ${{ steps.version.outputs.tag }}
          files: |
            build/firmware.nbo
            build/firmware-recovery.nbo
            build/emergency.nbo
          generate_release_notes: true

  build-windows-exe:
    needs: build-and-release
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python-Abhaengigkeiten installieren
        run: pip install -r windows/requirements.txt

      - name: Windows-Installer (.exe) bauen
        run: python windows/build_exe.py

      - name: Windows-Installer als Download-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows/dist/Gamification Installer.exe
          retention-days: 90

      - name: Windows-Installer an bestehende GitHub Release anhaengen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-release.outputs.tag }}
          files: windows/dist/Gamification Installer.exe
