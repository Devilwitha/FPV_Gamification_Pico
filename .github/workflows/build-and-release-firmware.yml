name: Firmware bauen & releasen

# Baut firmware.nbo mit build_firmware.py (Kommandozeilen-Modus, kein GUI
# noetig) und veroeffentlicht das Ergebnis als:
#   1. Download-Artefakt des Workflow-Laufs (Actions-Tab, ~90 Tage gueltig)
#   2. Anhang einer neuen GitHub Release mit automatisch generierter
#      Versionsnummer (Datum + Lauf-Nummer)
on:
  push:
    branches:
      - main
    paths:
      - "source/main.py"
      - "source/index.html"
      - "source/admin_*.html"
      - "source/boot.py"
      - "source/boot_runtime.py"
      - "source/recovery.py"
      - "source/hotspot_common.py"
      - "source/ota_helpers.py"
      - "source/firmware_version.txt"
      - "source/version.json"
      - "build_firmware.py"
  workflow_dispatch: {}
    # Manuelles Ausloesen ueber den "Run workflow"-Button im Actions-Tab.

permissions:
  contents: write
    # Noetig, damit der Workflow eine GitHub Release erstellen darf.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Firmware-Bundle bauen (firmware.nbo)
        run: python build_firmware.py build/firmware.nbo
        # Erhoeht dabei automatisch die Firmware-Versionsnummer (version.json /
        # firmware_version.txt, Format X.Y.Z -> X.Y.Z+1, siehe build_firmware.py).

      - name: Versionsnummer bestimmen
        id: version
        run: |
          FW_VERSION=$(python -c "import json; print(json.load(open('source/version.json'))['version'])")
          echo "tag=v${FW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Neue Versionsnummer ins Repo zurueckschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/version.json source/firmware_version.txt
          if ! git diff --cached --quiet; then
            git commit -m "Firmware-Version auf ${{ steps.version.outputs.tag }} erhoeht [skip ci]"
            git push
          fi

      - name: firmware.nbo als Download-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: firmware.nbo
          path: build/firmware.nbo
          retention-days: 90

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Firmware ${{ steps.version.outputs.tag }}
          files: build/firmware.nbo
          generate_release_notes: true
