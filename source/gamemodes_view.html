<!DOCTYPE html><html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Modes</title>
<style>
:root{--bg:#070b12;--panel:#111824;--panel2:#0d141f;--line:#26354a;--text:#eef4fb;--muted:#9fb4cb;--koth:#e6a23c;--race:#2980b9;--shooter:#c0392b;--good:#2ecc71}
*{box-sizing:border-box}
body{margin:0;padding:18px;font-family:sans-serif;background:radial-gradient(circle at top,#10203a 0,#070b12 45%,#04070c 100%);color:var(--text)}
.c{max-width:680px;margin:0 auto;background:linear-gradient(180deg,rgba(20,27,37,.96),rgba(12,18,28,.98));padding:22px;border-radius:18px;border:1px solid var(--line);box-shadow:0 18px 45px rgba(0,0,0,.45)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{margin:0;color:var(--text);font-size:1.5em;letter-spacing:1px;text-transform:uppercase}
.badge{color:var(--muted);font-size:.82em;padding:.35rem .6rem;border:1px solid #30465f;border-radius:999px;background:#0e1622}
.game{position:relative;background:linear-gradient(180deg,rgba(13,20,31,.98),rgba(9,14,22,.98));border:1px solid var(--line);border-left:4px solid var(--gc,var(--koth));border-radius:14px;padding:16px;margin-top:14px}
.game h2{margin:0 0 10px;font-size:1.05em;color:#d8e5f4;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#555;flex-shrink:0}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good);animation:pulse 1.4s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
.st{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:.88em}
.st b{text-align:right;overflow-wrap:anywhere}
.lb,.lap{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.85em}
.hint{color:var(--muted);font-size:.78em;margin:6px 0 4px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 150px;background:var(--koth);color:#fff;border:none;border-radius:11px;padding:11px 14px;cursor:pointer;font-weight:700;text-decoration:none}
.b.race{background:var(--race)}
.b.shooter{background:var(--shooter)}
.b:hover{filter:brightness(1.08)}
.footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.ver{color:#89a7c4;font-size:.78em}
</style>
</head>
<body>
<div class="c">
<div class="top"><h1 data-i18n="gamemodesView.title">&#127942; GAME MODES</h1><div class="badge" data-i18n="gamemodesView.liveBadge">LIVE</div></div>

<!--PLUGIN_SLOT:gamemodes_card-->

<p class="hint" data-i18n="gamemodesView.hint">Werte aktualisieren sich automatisch. Einstellungen/Starten/Stoppen erfolgt in den jeweiligen Steuerbereichen.</p>

<div class="btnrow">
<!--PLUGIN_SLOT:gamemodes_button-->
</div>
<div class="btnrow">
<a class="b" href="/" data-i18n="gamemodesView.homeButton">&#128029; Zur Startseite</a>
</div>
<div class="footer-row"><span class="ver" id="ver"></span></div>
</div>
<!--PLUGIN_SLOT:gamemodes_script-->
<script>
let I18N={strings:{}};
function t(k,f){const v=I18N.strings[k];return typeof v==='string'?v:f;}
window.t=t;
function applyI18n(){document.querySelectorAll('[data-i18n]').forEach(el=>{const s=t(el.getAttribute('data-i18n'),'');if(s)el.innerHTML=s;});document.title=t('gamemodesView.pageTitle','Game Modes');}
function loadI18n(){return fetch('/i18n-data',{cache:'no-store'}).then(r=>r.json()).then(d=>{I18N.strings=d.strings||{};applyI18n();}).catch(()=>{});}
function fmt(sec){sec=Math.max(0,Number(sec)||0);const m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');}
function fmtMs(ms){if(ms===null||ms===undefined)return '-';return (Number(ms)/1000).toFixed(2)+'s';}

function loadVersion(){fetch('/system-info',{cache:'no-store'}).then(r=>r.json()).then(d=>document.getElementById('ver').innerText=d.firmware_version?'v'+d.firmware_version:'').catch(()=>{});}
loadI18n().then(()=>{(window.GAMEMODES_HOOKS||[]).forEach(fn=>fn());loadVersion();});setInterval(loadI18n,5000);
</script>
</body></html>
