{% extends "base.html" %}

{% block title %}Webshop – Login{% endblock %}

{% block content %}
  <section class="login-page">
    <h1>Login</h1>
    <p class="license-intro">
      Melde dich mit E-Mail-Adresse und Passwort an. Noch kein Konto?
      <a href="{{ url_for('register') }}">Jetzt registrieren</a>.
    </p>

    <div class="login-card">
      {% if error %}
        <div class="checkout-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('login') }}">
        <div class="form-field">
          <label for="login-email">E-Mail-Adresse</label>
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="du@example.com"
            autocomplete="email"
            required
          />
        </div>
        <div class="form-field">
          <label for="login-password">Passwort</label>
          <input
            type="password"
            id="login-password"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary btn-large">Einloggen</button>
      </form>
    </div>
  </section>
{% endblock %}
