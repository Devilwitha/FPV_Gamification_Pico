<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - System</title>
<style>
body{background:#0a0c12;color:#e8f0f8;margin:0;padding:12px;font-family:monospace}
h1{color:#8e44ad;font-size:1.3em;margin:0 0 10px}
.c{max-width:700px;margin:0 auto;background:#141b25;padding:20px;border:2px solid #8e44ad;border-radius:8px}
.nv{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.nv a{flex:1 1 80px;text-align:center;padding:8px 4px;background:#1a2637;color:#9fb4cb;border-radius:6px;text-decoration:none;font-size:.78em;border:1px solid #2a3b52}
.nv a.on{background:#8e44ad;color:#fff;border-color:#8e44ad;font-weight:bold}
.s{background:#1a2637;padding:15px;border:1px solid #335174;border-radius:8px;margin:10px 0}
.s h2{color:#d8e5f4;margin:0 0 10px;font-size:1em}
.st2{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:.9em}
.st2:last-child{border-bottom:0}
.b{background:#c0392b;color:#fff;padding:10px 15px;border:0;border-radius:4px;cursor:pointer;margin:5px 2px;font-weight:bold;font-family:monospace}
.b:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div class="c">
<h1>&#128295; SYSTEM</h1>
<div class="nv">
<a href="/admin">Dashboard</a>
<a href="/admin-update">Update</a>
<a href="/admin-simulate">Simulation</a>
<a href="/admin-profiles">Profile</a>
<a href="/admin-system" class="on">System</a>
<a href="/">Home</a>
</div>
<div class="s">
<h2>Info</h2>
<div class="st2"><span>SSID</span><b id="v_ssid">-</b></div>
<div class="st2"><span>IP-Adresse</span><b id="v_ip">-</b></div>
<div class="st2"><span>Freier Speicher</span><b id="v_memfree">-</b></div>
<div class="st2"><span>Belegter Speicher</span><b id="v_memalloc">-</b></div>
<div class="st2"><span>Laufzeit</span><b id="v_uptime">-</b></div>
<div class="st2"><span>Aktives Trick-Profil</span><b id="v_prof">-</b></div>
<div class="st2"><span>OTA aktiv</span><b id="v_ota">-</b></div>
</div>
<div class="s">
<h2>Restart</h2>
<div id="rs" style="color:#9fb4cb;font-size:.9em;margin-bottom:8px">Startet den Pico neu, ohne eine Datei zu aendern.</div>
<button class="b" onclick="r()">&#128260; Restart</button>
</div>
</div>
<script>
function fmtUptime(sec){
const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
return h+'h '+m+'m '+s+'s';
}
function upd(){
fetch('/system-info',{cache:'no-store'}).then(r=>r.json()).then(d=>{
document.getElementById('v_ssid').innerText=d.ssid||'-';
document.getElementById('v_ip').innerText=d.ip||'-';
document.getElementById('v_memfree').innerText=(d.mem_free>=0)?(d.mem_free/1024).toFixed(1)+' KB':'?';
document.getElementById('v_memalloc').innerText=(d.mem_alloc>=0)?(d.mem_alloc/1024).toFixed(1)+' KB':'?';
document.getElementById('v_uptime').innerText=fmtUptime(d.uptime_s||0);
document.getElementById('v_prof').innerText=d.trick_tuning_profile||'-';
document.getElementById('v_ota').innerText=d.ota_active?'Ja':'Nein';
}).catch(e=>0);
}
function r(){
if(confirm('Pico jetzt neu starten?')){
document.getElementById('rs').innerText='Neustart laeuft...';
fetch('/restart-pico',{cache:'no-store'}).catch(()=>{});
setTimeout(()=>location.href='/',2500);
}
}
upd();setInterval(upd,3000);
</script>
</body>
</html>
