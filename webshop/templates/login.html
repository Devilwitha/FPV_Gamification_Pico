{% extends "base.html" %}

{% block title %}{{ _("Webshop – Login") }}{% endblock %}

{% block content %}
  <section class="login-page">
    <h1>{{ _("Login") }}</h1>
    <p class="license-intro">
      {{ _("Melde dich mit E-Mail-Adresse und Passwort an. Noch kein Konto?") }}
      <a href="{{ url_for('register', next=next_url) }}">{{ _("Jetzt registrieren") }}</a>.
    </p>

    <div class="login-card">
      {% if error %}
        <div class="checkout-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('login', next=next_url) }}">
        <div class="form-field">
          <label for="login-email">{{ _("E-Mail-Adresse") }}</label>
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="{{ _("du@example.com") }}"
            autocomplete="email"
            required
          />
        </div>
        <div class="form-field">
          <label for="login-password">{{ _("Passwort") }}</label>
          <input
            type="password"
            id="login-password"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary btn-large">{{ _("Einloggen") }}</button>
      </form>
    </div>
  </section>
{% endblock %}
