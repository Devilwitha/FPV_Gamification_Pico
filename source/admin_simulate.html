<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Simulation</title>
<style>
body{background:#0a0c12;color:#e8f0f8;margin:0;padding:12px;font-family:monospace}
h1{color:#2980b9;font-size:1.3em;margin:0 0 10px}
.c{max-width:700px;margin:0 auto;background:#141b25;padding:20px;border:2px solid #2980b9;border-radius:8px}
.nv{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.nv a{flex:1 1 80px;text-align:center;padding:8px 4px;background:#1a2637;color:#9fb4cb;border-radius:6px;text-decoration:none;font-size:.78em;border:1px solid #2a3b52}
.nv a.on{background:#2980b9;color:#fff;border-color:#2980b9;font-weight:bold}
.s{background:#1a2637;padding:15px;border:1px solid #335174;border-radius:8px;margin:10px 0}
.s h2{color:#d8e5f4;margin:0 0 10px;font-size:1em}
.b{background:#2980b9;color:#fff;padding:12px 15px;border:0;border-radius:4px;cursor:pointer;margin:5px 2px;font-weight:bold;font-family:monospace;font-size:1em}
.b:hover{filter:brightness(1.1)}
.b.flip{background:#8e44ad}
.b.spin{background:#16a085}
#simst{color:#9fb4cb;font-size:.9em;margin-bottom:10px}
</style>
</head>
<body>
<div class="c">
<h1 data-i18n="simulate.title">&#127917; TRICK-SIMULATION</h1>
<div class="nv">
<a href="/admin" data-i18n="nav.dashboard">Dashboard</a>
<a href="/admin-update" data-i18n="nav.update">Update</a>
<a href="/admin-simulate" class="on" data-i18n="nav.simulation">Simulation</a>
<a href="/admin-profiles" data-i18n="nav.profiles">Profile</a>
<a href="/admin-system" data-i18n="nav.system">System</a>
<a href="/admin-idcard" data-i18n="nav.idcard">Ausweis</a>
<a href="/admin-challenges" data-i18n="nav.challenges">Challenges</a>
<a href="/admin-infection" data-i18n="nav.infection">Infection</a>
<a href="/admin-koth" data-i18n="nav.koth">King of the Hill</a>
<a href="/admin-race" data-i18n="nav.race">Race</a>
<a href="/admin-shooter" data-i18n="nav.shooter">Shooter</a>
<a href="/admin-credits" data-i18n="nav.credits">Credits</a>
<a href="/" data-i18n="nav.home">Home</a>
</div>
<div class="s">
<h2 data-i18n="simulate.section">Ohne Drohne testen</h2>
<div id="simst" data-i18n="simulate.ready">Bereit...</div>
<button class="b" onclick="sim('roll')" data-i18n="simulate.roll">Roll</button>
<button class="b flip" onclick="sim('flip')" data-i18n="simulate.flip">Flip</button>
<button class="b spin" onclick="sim('spin')" data-i18n="simulate.spin">Spin</button>
</div>
</div>
<script>
let I18N={strings:{}};
function t(k,f){const v=I18N.strings[k];return typeof v==='string'?v:f;}
function applyI18n(){document.querySelectorAll('[data-i18n]').forEach(el=>{const s=t(el.getAttribute('data-i18n'),'');if(s)el.innerHTML=s;});document.title=t('simulate.pageTitle','Admin - Simulation');}
function loadI18n(){return fetch('/i18n-data',{cache:'no-store'}).then(r=>r.json()).then(d=>{I18N.strings=d.strings||{};applyI18n();}).catch(()=>{});}
function sim(kind){
const s=document.getElementById('simst');
s.innerText=t('simulate.running','Simuliere ') + kind + '...';
fetch('/simulate-trick?type='+kind,{cache:'no-store'}).then(r=>r.json()).then(d=>{
s.innerText=d.ok?(d.trick?('OK: '+d.trick+' (+'+d.points+' '+t('simulate.points','Pkt')+')'):t('simulate.noTrick','Kein Trick erkannt (Schwellenwerte pruefen)')):(t('common.errorPrefix','Fehler: ')+d.error);
}).catch(er=>{s.innerText='Fehler: '+er;});
}
loadI18n();
setInterval(loadI18n,5000);
</script>
</body>
</html>
